name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gas-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gas/package-lock.json
      - run: npm ci
      - run: npm test
